# Add one entry per league here. That's the only change needed to support
# a new league - no code changes anywhere in src/betting_model/.
#
# data_folder: where you've dropped that league's football-data.co.uk CSVs,
#   relative to the betting_model/ project root.
# api_sports_league_id: the league id from api-sports.io, needed once you
#   wire this into the live weekly pipeline (not used for backtesting).
# bookmaker_prefix: leave unset to auto-detect (prefers B365, then Betfair,
#   then Pinnacle, then the market average). Set explicitly if a league's
#   data is inconsistent about which bookmaker columns are populated.
# model_overrides: optional DixonColesModel constructor kwargs specific to
#   this league - e.g. a smaller league with fewer matches per season might
#   want a higher l2_penalty (more shrinkage) since there's less data to
#   estimate each team's rating from.

leagues:
  - code: epl
    name: English Premier League
    data_folder: data/raw/epl
    api_sports_league_id: 39
    bookmaker_prefix: null
    model_overrides: {}

  # Synthetic test league - generated by scripts/make_synthetic_data.py,
  # used to verify the pipeline end-to-end. Safe to delete this entry and
  # the data/raw/epl_test/ folder once you trust the real epl backtest.
  - code: epl_test
    name: EPL (synthetic test data)
    data_folder: data/raw/epl_test
    api_sports_league_id: null
    bookmaker_prefix: null
    model_overrides: {}

  # Example of what adding a second real league looks like - uncomment and
  # fill in once you have the data:
  #
  # - code: la_liga
  #   name: La Liga
  #   data_folder: data/raw/la_liga
  #   api_sports_league_id: 140
  #   bookmaker_prefix: null
  #   model_overrides: {}
