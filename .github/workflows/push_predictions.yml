name: Push predictions to Supabase

# Runs the production model against data/upcoming/fixtures.csv and
# upserts predictions into Supabase. Scheduled a few times a week --
# adjust to taste. Also runnable manually from the Actions tab, and
# automatically whenever fixtures.csv changes on main (so updating
# fixtures/odds and pushing is enough to trigger a re-run).

on:
  schedule:
    - cron: "0 8 * * 1,4"  # Mondays and Thursdays, 08:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/upcoming/fixtures.csv"

jobs:
  push-predictions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn scipy supabase

      - name: Push predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m src.export.push_predictions
